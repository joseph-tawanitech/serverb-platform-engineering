[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-b21"
version = "0.1.0"
description = "TAP B21 Agentic DevOps Orchestration"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=44.0",
    "tap-b20 @ file:../B20",
]

[tool.setuptools.packages.find]
where = ["src"]
