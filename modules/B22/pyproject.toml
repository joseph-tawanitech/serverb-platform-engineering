[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-b22"
version = "0.1.0"
description = "TAP B22 controlled infrastructure adapters"
requires-python = ">=3.14"
dependencies = [
    "tap-b21>=0.1.0",
    "kubernetes>=30.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
